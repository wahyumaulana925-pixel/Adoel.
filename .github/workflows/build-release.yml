name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diset. Tambahkan 4 secret (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) di Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Run unit tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adoel-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Read app version
        id: appver
        run: |
          cd android
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # Diterbitkan sebagai GitHub Release (bukan Actions artifact) — storage-nya
      # terpisah total dari kuota Actions artifact yang pernah penuh dan memblokir
      # upload berhari-hari. Tiap versionName dapat tag Release sendiri (v9.5, v9.6, ...)
      # supaya riwayat APK signed tetap tertelusur, tidak saling menimpa seperti debug-latest.
      - name: Publish signed release APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version_name }}
          name: "Adoel v${{ steps.appver.outputs.version_name }}"
          body: |
            APK release signed dari commit ${{ github.sha }} (run #${{ github.run_number }}).
          files: android/app/build/outputs/apk/release/app-release.apk
