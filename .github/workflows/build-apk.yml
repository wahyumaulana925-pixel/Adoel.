name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run unit tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # Diterbitkan sebagai GitHub Release (bukan Actions artifact) — storage-nya
      # terpisah total dari kuota Actions artifact yang pernah penuh dan memblokir
      # upload berhari-hari. Tag "debug-latest" ditimpa tiap kali build baru, jadi
      # selalu ada satu link stabil untuk APK debug paling baru.
      - name: Publish debug APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Debug build (latest)"
          body: |
            APK debug otomatis dari commit ${{ github.sha }} (run #${{ github.run_number }}).
            Release ini selalu ditimpa oleh build terbaru — bukan riwayat versi.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
